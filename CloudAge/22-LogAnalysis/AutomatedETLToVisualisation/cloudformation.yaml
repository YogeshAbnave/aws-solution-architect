  fixAthenaTemplateFunction446C00F2:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          from urllib.parse import unquote_plus

          import boto3

          s3_resource = boto3.resource("s3")


          def find_position_to_add_permission_boundary(doc_lines: list[str]):
              found_role = False
              for index, line in enumerate(doc_lines):
                  if "Type: AWS::IAM::Role" in line:
                      found_role = True
                  elif found_role and "Properties:" in line:
                      return index + 1
              return None


          def fix_template(bucket_name: str, object_key: str):
              s3_object = s3_resource.Object(bucket_name, object_key)
              object_content = s3_object.get()["Body"].read().decode("utf-8")

              all_lines = object_content.splitlines()
              lines_not_reserved_concurrency = [
                  line for line in all_lines if "ReservedConcurrentExecutions: 1" not in line
              ]

              if len(lines_not_reserved_concurrency) != len(all_lines):
                  print("Fixed reserved concurrency")
                  position_for_permission_boundary = find_position_to_add_permission_boundary(
                      lines_not_reserved_concurrency
                  )
                  if position_for_permission_boundary:
                      current_line = lines_not_reserved_concurrency[
                          position_for_permission_boundary
                      ]
                      # Add Permission Boundary to the Role
                      spaces = len(current_line) - len(current_line.lstrip())

                      lines_not_reserved_concurrency.insert(
                          position_for_permission_boundary,
                          f"{' ' * spaces}"
                          + "PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/boundary_for_vpc_logs_template_role'",
                      )
                  print("Removing reserved concurrency")
                  clean_template = "\n".join(lines_not_reserved_concurrency)
                  s3_object.put(Body=clean_template.encode("utf-8"))
              else:
                  print("No reserved concurrency to fix")


          def lambda_handler(event, context):
              for record in event.get("Records"):
                  event_name = record.get("eventName")
                  if record.get("eventSource") == "aws:s3" and event_name.startswith(
                      "ObjectCreated:"
                  ):
                      s3_event = record.get("s3")
                      bucket_name = s3_event.get("bucket", {}).get("name")
                      object_key = unquote_plus(s3_event.get("object", {}).get("key"))
                      if object_key.endswith("yml") or object_key.endswith("yaml"):
                          print(f"Will check object {object_key} at bucket {bucket_name}")
                          fix_template(bucket_name, object_key)
      FunctionName: fix_athena_template_function
      Handler: index.lambda_handler
      MemorySize: 512
      Role:
        Fn::GetAtt:
          - copyDataRole85605A2D
          - Arn
      Runtime: python3.11
      Timeout: 300
    DependsOn:
      - copyDataRoleDefaultPolicyE40F6998
      - copyDataRole85605A2D
    Metadata:
      aws:cdk:path: CdkLab1e434b68Stack/fixAthenaTemplateFunction/Resource
