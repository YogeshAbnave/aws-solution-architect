AWSTemplateFormatVersion: '2010-09-09'

# NOTE: this template depends on an exported value from the vscode-template stack with the name 'WorkshopAssetsBucket'
Parameters:
  WorkshopStudioAssetsBucket:
    Description: Assets bucket name
    Type: String
  WorkshopStudioAssetsBucketPrefix:
    Description: Assets bucket prefix
    Type: String
  EmbeddingsModel:
    Description: Model ID of Embeddings Model
    Type: String
    Default: "amazon.titan-embed-text-v2:0"
  LanguageModel:
    Description: Model ID of Language Model
    Type: String
    Default: "amazon.nova-pro-v1:0"
  AOSSCollectionName:
    Description: Name of AOSS Collection
    Type: String
    Default: "bedrock-knowledge-base"
  AOSSIndexName:
    Description: Name of AOSS Index
    Type: String
    Default: "bedrock-knowledge-base-index"
  AOSSVectorName:
    Description: Name of AOSS Index
    Type: String
    Default: "bedrock-knowledge-base-vector" # NOTE: this value must match the name of the vector in the IndexCreator Lambda function code.
  ParticipantRoleArn:
    Description: Arn of participant IAM Role
    Type: String

Resources:
  # Customer Managed KMS Key for AOSS and DynamoDB
  CustomerManagedKey:
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Version: 2012-10-17
        Id: kms-key-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'

  PatientInfoTable:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W78
            reason: Adding backup to this table that has sample data adds unnecessary complexity
          - id: W28
            reason: Table has explicit name to make it easier to locate in the CloudWatch console.
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: healthcarepatientinfo
      BillingMode: "PROVISIONED"      
      AttributeDefinitions:
        - AttributeName: name
          AttributeType: 'S'
      KeySchema:
        - AttributeName: name
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      SSESpecification:
        KMSMasterKeyId: !Ref CustomerManagedKey
        SSEEnabled: true
        SSEType: KMS

  PatientPhiInfoTable:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W78
            reason: Adding backup to this table that has sample data adds unnecessary complexity
          - id: W28
            reason: Table has explicit name to make it easier to locate in the CloudWatch console.
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: healthcarepatientphiinfo
      BillingMode: "PROVISIONED"      
      AttributeDefinitions:
        - AttributeName: name
          AttributeType: 'S'
      KeySchema:
        - AttributeName: name
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      SSESpecification:
        KMSMasterKeyId: !Ref CustomerManagedKey
        SSEEnabled: true
        SSEType: KMS

  # Lambda custom resource to populate the DynamoDB tables
  DynamoDBWriterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - !Sub lambda.${AWS::URLSuffix}
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowDynamoDBWrite
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:UpdateItem
                Resource: 
                  - !GetAtt PatientInfoTable.Arn
                  - !GetAtt PatientPhiInfoTable.Arn
                  - !GetAtt UserTable.Arn
              - Sid: AllowKMSActions
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext                
                Resource:
                  - !GetAtt CustomerManagedKey.Arn

  DynamoDBWriterLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role associated with the Lambda function has the AWSLambdaBasicExecutionRole managed policy attached, which includes permission to write CloudWatch Logs. See https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
          - id: W89
            reason: CloudFormation custom function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Properties:
      Description: Writes patient records to the DynamoDB tables
      Handler: index.lambda_handler
      Runtime: python3.11
      MemorySize: 128
      Timeout: 10
      Architectures:
        - arm64
      Role: !GetAtt DynamoDBWriterLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          import logging
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Sample records
          john_doe_contact = {
            "name": "john doe",
            "address": "111, First St, Boston",
            "dob": "01-01-2001",
            "phonenumber": "111-111-1111"
          }

          jane_doe_contact = {
            "name": "jane doe",
            "address": "222, Second St, Boston",
            "dob": "02-02-2002",
            "phonenumber": "222-222-2222"
          }

          john_doe_medical = {
            "name": "john doe",
            "bloodpressure": "110/10",
            "bloodtype": "A+",
            "hdl": 101,
            "ldl": 102,
            "triglycerides": 103
          }

          jane_doe_medical = {
            "name": "jane doe",
            "bloodpressure": "220/20",
            "bloodtype": "B+",
            "hdl": 201,
            "ldl": 202,
            "triglycerides": 203
          }

          def write_to_table(table, data):
              response = table.put_item(Item=data)

          def cfn_response_error(event, context, message):
              cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=message)

          def lambda_handler(event, context):
            # Initialize DynamoDB client
            dynamodb = boto3.resource('dynamodb')
            patient_info_table_name = event['ResourceProperties']['PatientInfoTable']
            patient_medical_info_table_name = event['ResourceProperties']['PatientMedicalInfoTable']
            user_data_table_name =  event['ResourceProperties']['UserTable']

            # Get the DynamoDB table objects
            patient_info_table = dynamodb.Table(patient_info_table_name)
            patient_medical_info_table = dynamodb.Table(patient_medical_info_table_name)
            user_table = dynamodb.Table(user_data_table_name)


            try:
              write_to_table(patient_info_table, john_doe_contact)
              write_to_table(patient_medical_info_table, john_doe_medical)
              write_to_table(patient_info_table, jane_doe_contact)
              write_to_table(patient_medical_info_table, jane_doe_medical)
              logger.info('Successfully added patient records')

              # Define user data to be added to DynamoDB

              write_to_table(user_table, {"name": "Alice", "role":"Receptionist", "status": "enabled"})
              write_to_table(user_table, {"name": "Christine", "role":"Doctor", "status": "enabled"})
              write_to_table(user_table, {"name": "Bob",  "role":"Doctor", "status": "disabled"})
              
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='OK')
            except ClientError as e:
                logger.error(e.response['Error']['Message'])
                cfn_response_error(event, context, f"Error writing to DynamoDB: {str(e)}")
            except KeyError as e:
                logger.error(f"Missing key in event: {str(e)}")
                cfn_response_error(event, context, f"Missing key in event: {str(e)}")
            except Exception as e:
                logger.error(f"Unexpected error: {str(e)}")
                cfn_response_error(event, context, f"Unexpected error: {str(e)}")

  DynamoDBWriter:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt DynamoDBWriterLambda.Arn
      ServiceTimeout: 20
      PatientInfoTable: !Ref PatientInfoTable
      PatientMedicalInfoTable: !Ref PatientPhiInfoTable
      UserTable: !Ref UserTable

  HealthCareAgentLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role associated with the Lambda function has the AWSLambdaBasicExecutionRole managed policy attached, which includes permission to write CloudWatch Logs. See https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
          - id: W89
            reason: CloudFormation custom function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Properties:
      Description: Healthcare Agent Lambda
      Handler: HealthCareAgentLambda.lambda_handler
      Role: !GetAtt HealthCareLambdaRole.Arn
      Code:
        S3Bucket: !Ref WorkshopStudioAssetsBucket
        S3Key: !Sub "${WorkshopStudioAssetsBucketPrefix}HealthCareAgent-ActionGroupLambda.zip"
      Runtime: python3.12
      Timeout: 60

  HealthCareLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub lambda.${AWS::URLSuffix}
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HealthCareLambdaPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:List*
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:Describe*
                Resource:
                  - !GetAtt PatientInfoTable.Arn
                  - !GetAtt PatientPhiInfoTable.Arn
              - Sid: AllowKMSActions
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                Resource:
                  - !GetAtt CustomerManagedKey.Arn

  HealthCareLambdaPermissionBedrockAgent:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt HealthCareAgentLambda.Arn
      Principal: !Sub bedrock.${AWS::URLSuffix}
      SourceArn: !GetAtt BedrockAgent.AgentArn

  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub bedrock.${AWS::URLSuffix}
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: BedrockS3AOSSPolicy
          PolicyDocument:
            Version: '2012-10-17'          
            Statement:
              - Sid: AllowInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingsModel}
              - Sid: AllowS3List
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 
                    - 'arn:${AWS::Partition}:s3:::${WorkshopAssetsBucket}'
                    - WorkshopAssetsBucket: !ImportValue 'WorkshopAssetsBucket'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: AllowS3Get
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - 'arn:${AWS::Partition}:s3:::${WorkshopAssetsBucket}/*'
                    - WorkshopAssetsBucket: !ImportValue 'WorkshopAssetsBucket'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  AOSSDataPlaneAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: InvokeAOSSDataPlane
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AOSSDataPlaneAll
            Effect: Allow
            Action:
              - 'aoss:APIAccessAll'
            Resource:
              - !GetAtt AOSSCollection.Arn
      Roles:
        - !Ref BedrockKnowledgeBaseRole
        - !Ref IndexCreatorLambdaRole

  AOSSCollection:
    Type: 'AWS::OpenSearchServerless::Collection'
    Properties:
      Name: !Ref AOSSCollectionName
      Type: VECTORSEARCH
      Description: Bedrock Knowledge Base Search collection
    DependsOn: 
      - AOSSEncryptionPolicy
      - AOSSNetworkPolicy
      - AOSSDataAccessPolicy

  AOSSEncryptionPolicy:
    Type: 'AWS::OpenSearchServerless::SecurityPolicy'
    Properties:
      Name: workshop-encryption-policy
      Type: encryption
      Description: 'Encryption policy for AOSS collection'
      Policy: 
        !Sub |
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${AOSSCollectionName}"]
              }
            ],
            "AWSOwnedKey": false,
            "KmsARN": "${CustomerManagedKey.Arn}"
          }

  AOSSNetworkPolicy:
    Type: 'AWS::OpenSearchServerless::SecurityPolicy'
    Properties:
      Name: workshop-network-policy
      Type: network
      Description: 'Network policy for AOSS collection'
      Policy: 
        !Sub |
          [
            {
              "Rules": [
                {
                  "ResourceType": "collection",
                  "Resource": ["collection/${AOSSCollectionName}"]
                },
                {
                  "ResourceType": "dashboard",
                  "Resource": ["collection/${AOSSCollectionName}"]
                }
              ],
              "AllowFromPublic": true
            }
          ]

  AOSSDataAccessPolicy:
    Type: 'AWS::OpenSearchServerless::AccessPolicy'
    Properties:
      Name: workshop-data-access-policy
      Type: data
      Description: 'Access for Bedrock and IndexCreator'
      Policy: 
        !Sub >
          [
            {
              "Rules": [
                {
                  "ResourceType": "index",
                  "Resource": ["index/${AOSSCollectionName}/*"],
                  "Permission": [
                    "aoss:UpdateIndex",
                    "aoss:DescribeIndex",
                    "aoss:ReadDocument",
                    "aoss:WriteDocument",
                    "aoss:CreateIndex",
                    "aoss:DeleteIndex"
                  ]
                },
                {
                  "ResourceType": "collection",
                  "Resource": ["collection/${AOSSCollectionName}"],
                  "Permission": [
                    "aoss:DescribeCollectionItems",
                    "aoss:CreateCollectionItems",
                    "aoss:UpdateCollectionItems"
                  ]
                }
              ],
              "Principal": [
                "${BedrockKnowledgeBaseRole.Arn}",
                "${IndexCreatorLambdaRole.Arn}"
              ]
            }
          ]


  ParticipantAOSSDataAccessPolicy:
    Type: 'AWS::OpenSearchServerless::AccessPolicy'
    Properties:
      Name: participant-data-access-policy
      Type: data
      Description: 'Access for Participant'
      Policy: 
        !Sub >
          [
            {
              "Rules": [
                {
                  "ResourceType": "index",
                  "Resource": ["index/${AOSSCollectionName}/*"],
                  "Permission": [
                    "aoss:*"
                  ]
                },
                {
                  "ResourceType": "collection",
                  "Resource": ["collection/${AOSSCollectionName}"],
                  "Permission": [
                    "aoss:*"
                  ]
                }
              ],
              "Principal": [
                "${ParticipantRoleArn}"
              ]
            }
          ]



  # Lambda custom resource to create an OpenSearch index
  IndexCreatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - !Sub lambda.${AWS::URLSuffix}
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  IndexCreatorLambda:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Warning incorrectly reported. The role associated with the Lambda function has the AWSLambdaBasicExecutionRole managed policy attached, which includes permission to write CloudWatch Logs. See https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
          - id: W89
            reason: CloudFormation custom function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
          - id: W92
            reason: CloudFormation custom function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Properties:
      Description: Creates an index in OpenSearch
      Handler: index_creator.lambda_handler
      Runtime: python3.11
      MemorySize: 128
      Timeout: 120
      Architectures:
        - arm64
      Role: !GetAtt IndexCreatorLambdaRole.Arn
      Code:
        S3Bucket: !Ref WorkshopStudioAssetsBucket
        S3Key: !Sub "${WorkshopStudioAssetsBucketPrefix}OpenSearch-IndexCreatorLambda.zip"

  IndexCreator:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - AOSSDataPlaneAccessPolicy
    Properties:
      ServiceToken: !GetAtt IndexCreatorLambda.Arn
      ServiceTimeout: 120
      IndexName: !Ref AOSSIndexName
      CollectionEndpoint: !GetAtt AOSSCollection.CollectionEndpoint
      CollectionRegion: !Ref AWS::Region

  KnowledgeBaseWithAoss:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: 
      - AOSSDataPlaneAccessPolicy
      - IndexCreator
    Properties:
      Name: 'workshop-knowledge-base'
      Description: 'Documents for Doctors with disease fact sheets, and for Receptionists with policies for scheduling and cancelling appointments, available medical services, and details of healthcare practitioners'
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: "VECTOR"
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingsModel}"
      StorageConfiguration:
        Type: "OPENSEARCH_SERVERLESS"
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt AOSSCollection.Arn
          VectorIndexName: !Ref AOSSIndexName
          FieldMapping:
            VectorField: !Ref AOSSVectorName
            TextField: "text"
            MetadataField: "metadata"

  SampleDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBaseWithAoss
      Name: 'workshop-data-source'
      Description: 'Disease fact sheets and policy documents'
      DataSourceConfiguration:
        Type: "S3"
        S3Configuration:
          BucketArn: !Sub
            - 'arn:${AWS::Partition}:s3:::${WorkshopAssetsBucket}'
            - WorkshopAssetsBucket: !ImportValue 'WorkshopAssetsBucket'
          InclusionPrefixes: ["knowledge_base/Med_Office/"]

  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: !Sub bedrock.${AWS::URLSuffix}
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
            ArnLike:
              aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Statement:
              - Sid: InvokeFM
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                  - bedrock:GetFoundationModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${LanguageModel}
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${LanguageModel} # NOTE: this only works for Cross-Region Inference in US Regions
              - Sid: AllowApplyGuardrail
                Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
              - Sid: AllowS3GetOpenAPI
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - 'arn:${AWS::Partition}:s3:::${WorkshopAssetsBucket}/*'
                    - WorkshopAssetsBucket: !ImportValue 'WorkshopAssetsBucket'                    
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: InvokeKB
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource:
                  - !GetAtt KnowledgeBaseWithAoss.KnowledgeBaseArn
              - Sid: AllowKMSActions
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext                
                Resource:
                  - !GetAtt CustomerManagedKey.Arn

  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: "HealthcareAgent"
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      AutoPrepare: true
      FoundationModel: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${LanguageModel} # NOTE: this only works for Cross-Region Inference in US Regions
      Instruction: |
        You are an interactive healthcare agent who gets the patients data based on the patient's name in the <question>. 
        The patient's data contains contact details like patient name, age, address, and date of birth and medical details like blood group, blood pressure, HDL, LDL, and Triglycerides. 
        Only doctors are allowed to access a patient's medical details whereas receptionists are allowed to access only the patient's contact details. 
        If you dont have enough information to respond to an utterance, you can prompt additional information from the user like what is the patient's name, enter the patient's name. Sample questions are:
        1. Get data of the patient <patient name>
        2. Get medical data of <patient name>
        3. What is the address of the patient <patient name>
        4. What is the blood pressure of <patient name>
        5. What is the HDL of the patient <patient name>

      Description: "Helpful healthcare chatbot"
      IdleSessionTTLInSeconds: 900
      KnowledgeBases:
        - KnowledgeBaseId: !Ref KnowledgeBaseWithAoss
          Description: "Documents for Doctors with disease fact sheets, and for Receptionists with policies for scheduling and cancelling appointments, available medical services, and details of healthcare practitioners"
          KnowledgeBaseState: ENABLED
      ActionGroups:
        - ActionGroupExecutor: 
            Lambda: !GetAtt HealthCareAgentLambda.Arn
          ActionGroupName: "HealthCareAgent_ActionGroup" # NOTE: Action Groups must not use dashes ('-')
          ActionGroupState: ENABLED
          ApiSchema:
            S3:
              S3BucketName: !ImportValue 'WorkshopAssetsBucket'
              S3ObjectKey: "HealthCareAgentAPISchema.json"
          Description: "API that provides contact and medical information for patients."
    
  BedrockAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentAliasName: "InitialVersion"
      AgentId: !GetAtt BedrockAgent.AgentId
      Description: "Initial version of the agent"


########### office users table ###########
  UserTable:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W78
            reason: Adding backup to this table that has sample data adds unnecessary complexity
          - id: W28
            reason: Table has explicit name to make it easier to locate in the CloudWatch console.
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "UserTable"
      BillingMode: "PROVISIONED"
      AttributeDefinitions:
        - AttributeName: "name"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "name"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      SSESpecification:
        KMSMasterKeyId: !Ref CustomerManagedKey
        SSEEnabled: true
        SSEType: KMS


  ########### CloudWatch Resources ###########
  WorkshopLogGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: Adding encryption at rest will add unnecessary complexity to this log group that has Application Logs.
    Type: AWS::Logs::LogGroup
    DeletionPolicy: "Delete"
    Properties:
      LogGroupClass: "STANDARD"
      LogGroupName: workshop-log-group
      RetentionInDays: 14





  # Metric Filter for prompt attack
  MetricFilterPrompt:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkshopLogGroup
      FilterPattern: '{$.user=* && $.*=%"type":"PROMPT_ATTACK"%}'
      MetricTransformations:
        - MetricName: prompt-attack
          MetricNamespace: workshopDemoApp/userQuery
          MetricValue: "1"
          Dimensions:
            - Key: username
              Value: $.user
          Unit: Count

  # Metric Filter for harmful content
  MetricFilterMisconduct:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkshopLogGroup
      FilterPattern: '{$.user=* && $.*=%"type":"MISCONDUCT"%}'
      MetricTransformations:
        - MetricName: misconduct
          MetricNamespace: workshopDemoApp/userQuery
          MetricValue: "1"
          Dimensions:
            - Key: username
              Value: $.user
          Unit: Count
                    
  UpdateUserStatusRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaDynamoDBAccess
          PolicyDocument:
