  UpdateUserStatusEventPermissionChristine:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UserManagementLambda.Arn
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*

  UserManagementLambda:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Alarm response function does not need the scaffolding of a VPC, to do so would add unnecessary complexity
          - id: W92
            reason: Alarm response function does not need reserved concurrent executions, to do so would add unnecessary complexity
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda function to handle CloudWatch alarms and update user status in DynamoDB
      Handler: index.lambda_handler
      Runtime: python3.11
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt UpdateUserStatusRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import logging

          # Initialize logger
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # DynamoDB table name
          DYNAMODB_TABLE_NAME = "UserTable"

          # Initialize DynamoDB resource
          dynamodb = boto3.resource('dynamodb', region_name='us-west-2')
          table = dynamodb.Table(DYNAMODB_TABLE_NAME)

          def update_user_status(username, status):
              """
              Updates the user's status in DynamoDB.
              """
              try:
                  response = table.update_item(
                      Key={'name': username},
                      UpdateExpression="SET #status = :status",
                      ExpressionAttributeNames={"#status": "status"},
                      ExpressionAttributeValues={":status": status},
                      ReturnValues="UPDATED_NEW"
                  )
                  logger.info(f"User {username} status updated to {status}: {response}")
              except Exception as e:
                  logger.error(f"Failed to update user {username} status to {status}: {e}")
                  raise

          def lambda_handler(event, context):
              """
              Lambda function to process CloudWatch alarm events and update user status in DynamoDB.
              """
              logger.info(f"Received event: {json.dumps(event)}")

              try:
                  # Extract alarm details
                  alarm_data = event.get('alarmData', {})
                  if not alarm_data:
                      raise ValueError("Missing 'alarmData' in event.")

                  # Extract current alarm state and previous state
                  state = alarm_data.get('state', {}).get('value')
                  previous_state = alarm_data.get('previousState', {}).get('value')

                  if not state or not previous_state:
                      raise ValueError("Missing 'state' or 'previousState' in alarmData.")

                  # Extract metrics configuration
                  metrics = alarm_data.get('configuration', {}).get('metrics', [])
                  if not metrics:
                      raise ValueError("Missing 'metrics' in alarm configuration.")

                  # Find username from dimensions
                  for metric in metrics:
                      dimensions = metric.get('metricStat', {}).get('metric', {}).get('dimensions', {})
                      username = dimensions.get('username')
                      if username:
                          logger.info(f"Processing user: {username}")

                          # Handle state transitions
                          if previous_state == "OK" and state == "ALARM":
                              logger.info(f"Transition detected: OK -> ALARM for user {username}. Disabling user.")
                              update_user_status(username, "disabled")
                              return {"statusCode": 200, "body": f"User {username} disabled successfully."}
                          elif previous_state == "ALARM" and state == "OK":
                              logger.info(f"Transition detected: ALARM -> OK for user {username}. Re-enabling user.")
                              update_user_status(username, "enabled")
                              return {"statusCode": 200, "body": f"User {username} re-enabled successfully."}
                          else:
                              logger.info(f"No action required for transition {previous_state} -> {state}.")
                              return {"statusCode": 200, "body": f"No action required for {username}."}

                  raise ValueError("No username found in alarm dimensions.")

              except Exception as e:
                  logger.error(f"Error processing CloudWatch alarm: {e}")
                  return {"statusCode": 500, "body": str(e)}


  ## Enable AWS Config
  # S3 Bucket for AWS Config
  ConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 Bucket Policy for AWS Config
  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ConfigBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub '${AWS::AccountId}'
          - Sid: AWSConfigBucketExistenceCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt ConfigBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub '${AWS::AccountId}'
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': 'bucket-owner-full-control'
                aws:SourceAccount: !Sub '${AWS::AccountId}'

  # IAM Role for Config Recorder
  ConfigRecorderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - config.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWS_ConfigRole"

  # AWS Config Recorder
  ConfigRecorder: 
    Type: AWS::Config::ConfigurationRecorder
    Properties: 
      RoleARN: !GetAtt ConfigRecorderRole.Arn

  # AWS Config Delivery Channel
  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Properties:
      Name: config-delivery-channel
      S3BucketName: !Ref ConfigBucket
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: TwentyFour_Hours

  # IAM Role for Lambda Function
  BedrockAgentConfigRuleLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonBedrockReadOnly
      Policies:
        - PolicyName: ConfigPutEvaluations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:PutEvaluations
                  - config:GetComplianceDetailsByConfigRule
                Resource: '*'

  ## Custom Rule resources
  # Lambda Function
  BedrockAgentConfigRuleLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: bedrockAgentGuardrailPromptAttack.lambda_handler
      Role: !GetAtt BedrockAgentConfigRuleLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref WorkshopStudioAssetsBucket
        S3Key: !Sub "${WorkshopStudioAssetsBucketPrefix}BedrockAgentGuardrailPromptAttack-ConfigRule.zip"
      Runtime: python3.12
      Timeout: 300
      MemorySize: 128
      Layers:
      - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:711761543063:layer:rdklib-layer:33

  # Lambda Permission for Config
  BedrockAgentConfigRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BedrockAgentConfigRuleLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com

  # Custom Config Rule
  BedrockAgentConfigRule:
    Type: AWS::Config::ConfigRule
    DependsOn: BedrockAgentConfigRuleLambdaPermission
    Properties:
      ConfigRuleName: bedrock-agent-guardrail-prompt-attack
      Description: 'Checks whether Bedrock Agents are configured with a Guardrail and the Guardrail has the Prompt Attack content filter.'
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier: !GetAtt BedrockAgentConfigRuleLambdaFunction.Arn
        SourceDetails:
          - EventSource: aws.config
            MessageType: ScheduledNotification
            MaximumExecutionFrequency: One_Hour
      InputParameters: 
        AssumeRoleMode: "False"












